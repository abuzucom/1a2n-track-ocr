name: AGENTS.md Compliance

# Adopted from abuzucom/agents. Divergences from the upstream copy:
# actions are pinned by commit SHA rather than by major-version tag, and
# python-version is pinned to a minor release, both per AGENTS.md rule 8.
# Repo-specific checks that upstream does not ship live in
# agents-checks.yml instead, so this file stays close to canonical.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  banned-agents:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check banned-agent authorship
        run: |
          python scripts/check_banned_agents.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check branch name
        run: python scripts/check_branch_name.py

  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check commit messages
        run: |
          python scripts/check_commit_message.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check persist-credentials on checkout steps
        run: python scripts/check_persist_credentials.py .github/workflows/*.yml
      - name: Check for unjustified MD5/SHA-1
        run: |
          shopt -s nullglob
          files=(scripts/*.py)
          if [ ${#files[@]} -gt 0 ]; then
            python scripts/check_weak_hashing.py "${files[@]}"
          fi
      - name: Check for likely secrets
        run: |
          shopt -s nullglob
          files=(scripts/*.py .github/workflows/*.yml .pre-commit-config.yaml Makefile)
          if [ ${#files[@]} -gt 0 ]; then
            python scripts/check_secrets_heuristic.py "${files[@]}"
          fi
