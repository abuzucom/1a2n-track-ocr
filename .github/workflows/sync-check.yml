name: Convention Sync Check

# Adopted from abuzucom/agents. Divergences from the upstream copy:
# actions are pinned by commit SHA rather than by major-version tag, and
# python-version is pinned to a minor release, both per AGENTS.md rule 8.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run sync check
        run: python scripts/sync.py --check
      - name: Run style lint
        run: python scripts/lint_style.py
      - name: Check American spelling (warning only)
        run: python scripts/check_us_spelling.py AGENTS.md
      - name: Check English only (warning only)
        run: python scripts/check_english_only.py AGENTS.md
