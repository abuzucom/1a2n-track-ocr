name: agents-checks

# Repo-specific checks only. Everything the abuzucom/agents template
# ships is wired in agents-md-compliance.yml and sync-check.yml; this
# file holds the two checks that template does not provide.
#
# Upstream lints prose only in AGENTS.md. This repo is documentation
# heavy and public, so check_ascii.py runs across all tracked Markdown
# as well. See its ALLOWED list for the two constructs this repo
# permits that the canonical script would flag.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repo-specific checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Prose style across all Markdown
        run: |
          shopt -s nullglob globstar
          files=(**/*.md)
          if [ ${#files[@]} -gt 0 ]; then
            python scripts/check_ascii.py "${files[@]}"
          fi

      - name: Docs updated (warning only)
        run: python scripts/check_docs_updated.py --base "origin/${{ github.event.pull_request.base.ref || 'main' }}" --head HEAD
