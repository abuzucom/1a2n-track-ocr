name: agents-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  policy-checks:
    name: AGENTS.md policy checks
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag, including a
      # major-version tag like v4, can be repointed by anyone with push
      # access to the action's repo, so a tag pin is not a pin. Comments
      # record the human-readable version each SHA corresponds to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Branch name
        if: github.event_name == 'pull_request'
        run: python scripts/check_branch_name.py "${{ github.head_ref }}"

      - name: Banned agents
        run: python scripts/check_banned_agents.py --base "origin/${{ github.event.pull_request.base.ref || 'main' }}" --head HEAD

      - name: ASCII only
        run: python scripts/check_ascii.py

      - name: No em/en dashes
        run: python scripts/lint_style.py

      - name: Weak hashing
        run: python scripts/check_weak_hashing.py

      - name: Secrets heuristic
        run: python scripts/check_secrets_heuristic.py

      - name: persist-credentials on checkout steps
        run: python scripts/check_persist_credentials.py

      - name: Non-root containers
        run: python scripts/check_dockerfile_root.py

      - name: US spelling (warning only)
        run: python scripts/check_us_spelling.py

      - name: English only (warning only)
        run: python scripts/check_english_only.py

      - name: Docs updated (warning only)
        run: python scripts/check_docs_updated.py --base "origin/${{ github.event.pull_request.base.ref || 'main' }}" --head HEAD
