name: app-tests

# Tests the application itself, as opposed to the policy and prose
# checks in agents-checks.yml, agents-md-compliance.yml, and
# sync-check.yml. Those three could all pass while the auth dependency
# was deleted from both endpoints, the firmware stopped compiling, or a
# lock drifted from its manifest, which is the gap this file closes.
#
# Versions are pinned rather than floating: actions by commit SHA,
# Python and PlatformIO by exact version, the Caddy image by digest.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: app-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-gate:
    name: Application gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      caddy: ${{ steps.changes.outputs.caddy }}
      firmware: ${{ steps.changes.outputs.firmware }}
      lock: ${{ steps.changes.outputs.lock }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Detect application changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/detect_app_changes.py \
            --base "$BASE_SHA" --head HEAD >> "$GITHUB_OUTPUT"

      - name: Check every manifest against its lock
        if: steps.changes.outputs.lock == 'true'
        run: python scripts/check_lock_sync.py

      # Pinned by digest, not by tag: a tag, including a patch tag, can
      # be repushed by whoever controls the image. Digest is caddy
      # 2.11.4-alpine.
      - name: Validate Caddyfile
        if: steps.changes.outputs.caddy == 'true'
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config Caddyfile

  backend-tests:
    name: Backend tests
    needs: application-gate
    if: needs.application-gate.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install backend dev dependencies
        run: pip install --require-hashes -r server/requirements-dev.lock

      - name: Run backend tests
        working-directory: server
        run: python -m pytest tests/ -v

      - name: Run ML assurance tests
        working-directory: ml
        run: python -m pytest tests/ -v

  firmware-build:
    name: Firmware build
    needs: application-gate
    if: >-
      needs.application-gate.outputs.firmware == 'true' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The PR number isolates branches. Toolchain inputs invalidate the
      # cache; source changes let PlatformIO rebuild only affected objects.
      - name: Cache incremental firmware builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: firmware/.pio/build
          key: >-
            pio-build-${{ runner.os }}-${{ github.event.pull_request.number }}-
            ${{ hashFiles('firmware/platformio.ini', 'dependency-provenance.json',
            'scripts/verify_dependency_provenance.py', '.github/workflows/app-tests.yml') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Verify firmware dependency archives
        run: |
          python scripts/verify_dependency_provenance.py \
            --firmware-output-dir "$RUNNER_TEMP/firmware-packages"

      - name: Install pinned firmware platform
        run: |
          pio pkg install --global --platform \
            "https://github.com/pioarduino/platform-espressif32.git#2a01b8848872983802e5f6f17d0b004df659b3c9" \
            --force

      - name: Bind platform to verified frameworks
        run: |
          python scripts/verify_dependency_provenance.py \
            --bind-platform "$HOME/.platformio/platforms/espressif32/platform.json" \
            --firmware-package-dir "$RUNNER_TEMP/firmware-packages"

      - name: Install verified firmware frameworks
        run: |
          pio pkg install --global --tool \
            "$RUNNER_TEMP/firmware-packages/esp32-core-3.3.11.tar.xz" --force
          pio pkg install --global --tool \
            "$RUNNER_TEMP/firmware-packages/esp32-core-3.3.11-libs.tar.xz" --force

      # config.h is gitignored because it holds per-rig WiFi credentials
      # and the backend token. The example has placeholder values, which
      # is all a compile check needs.
      #
      # Building the example verbatim would only ever compile the
      # transport it happens to default to, leaving every other transport
      # unbuilt and free to break unnoticed. So the example's transport
      # lines are dropped and one is appended per pass.
      - name: Build every transport
        working-directory: firmware
        env:
          TRANSPORTS: TRANSPORT_BLE TRANSPORT_WIFI
        run: |
          for transport in $TRANSPORTS; do
            echo "::group::$transport"
            grep -vF \
              -e '#define TRANSPORT_BLE' \
              -e '#define TRANSPORT_WIFI' \
              src/config.h.example > src/config.h
            echo "#define $transport" >> src/config.h
            pio run
            echo "::endgroup::"
          done

      # The production profile differs only in its secure-boot sdkconfig,
      # which is transport independent, and rebuilding the SDK per
      # transport is slow. One pass on the example's default is enough.
      - name: Provide a placeholder config.h
        run: cp firmware/src/config.h.example firmware/src/config.h

      - name: Build production firmware
        working-directory: firmware
        run: pio run -e w11-esp32s3-production

      - name: Verify production SDK configuration
        working-directory: firmware
        run: |
          config=sdkconfig.w11-esp32s3-production
          grep -qx 'CONFIG_SECURE_BOOT_V2_ENABLED=y' "$config"
          grep -qx 'CONFIG_SECURE_SIGNED_APPS_RSA_SCHEME=y' "$config"
          grep -qx 'CONFIG_SECURE_FLASH_ENC_ENABLED=y' "$config"
          grep -qx 'CONFIG_SECURE_FLASH_ENCRYPTION_MODE_RELEASE=y' "$config"
          grep -qx 'CONFIG_SECURE_FLASH_ENCRYPTION_AES256=y' "$config"
          grep -qx 'CONFIG_FLASH_ENCRYPTION_ENABLED=y' "$config"
