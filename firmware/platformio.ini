; PlatformIO project for the W11 ESP32-S3 Mini Module.
; Board pin map and specs: docs/hardware_documentation.md
; ESP32-S3R8: 16MB QSPI flash (W25Q128JWUIQ), 8MB embedded octal PSRAM,
; matched by the esp32-s3-devkitc1-n16r8 board definition.

[env:w11-esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; esp32-camera is pinned by commit, not by the v2.1.7 tag it belongs to:
; a git tag can be moved, so it is not a pin. Chirale is a registry
; version, which is immutable.
lib_deps =
    https://github.com/espressif/esp32-camera.git#202df95d7b1dc72e9303ad78f47b8dc9f339e6a1
    spaziochirale/Chirale_TensorFlowLite@2.0.0
