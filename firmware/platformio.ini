; PlatformIO project for the W11 ESP32-S3 Mini Module.
; Board pin map and specs: docs/hardware_documentation.md
; ESP32-S3R8: 16MB QSPI flash (W25Q128JWUIQ), 8MB embedded octal PSRAM,
; matched by the esp32-s3-devkitc1-n16r8 board definition.

[platformio]
default_envs = w11-esp32s3

[env:w11-esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#2a01b8848872983802e5f6f17d0b004df659b3c9
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; esp32-camera is pinned by commit, not by the v2.1.7 tag it belongs to:
; a git tag can be moved, so it is not a pin. Chirale is a registry
; version, which is immutable.
lib_deps =
    https://github.com/espressif/esp32-camera.git#202df95d7b1dc72e9303ad78f47b8dc9f339e6a1
    spaziochirale/Chirale_TensorFlowLite@2.0.0

; Compile-only production profile. Building is safe; provisioning and
; first boot burn irreversible eFuses, so PlatformIO upload is disabled.
; Sign the resulting app and bootloader through the documented controlled
; provisioning process before flashing them.
[env:w11-esp32s3-production]
extends = env:w11-esp32s3
upload_protocol = custom
custom_sdkconfig =
    CONFIG_SECURE_BOOT=y
    CONFIG_SECURE_BOOT_V2_ENABLED=y
    CONFIG_SECURE_SIGNED_APPS_RSA_SCHEME=y
    CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES=n
    CONFIG_SECURE_FLASH_ENC_ENABLED=y
    CONFIG_SECURE_FLASH_ENCRYPTION_MODE_RELEASE=y
    CONFIG_SECURE_FLASH_ENCRYPTION_AES256=y
